const notes={welcome:['第一眼，就认识 Buddy。','锁扣是角色的身体，开口是它的橙色扣门。漫画只承担欢迎与陪伴，正式说明用可读的清单。'],gym:['把空间，留给岩壁。','场景占据核心区域。顶部切馆，底部选线；人物与视角用图标操作。打开线路后，底板只保留必要信息。'],routes:['像看线路牌一样找线。','难度、岩点色与墙面在同一行。颜色始终配文字；搜索和筛选保持轻量。'],body:['调整的是身体，不是分数。','身高、体重和视角使用原生滑杆。角色图标不抢场景，所有模拟都明确标为模型推演。'],simulation:['只有动作，值得占据中央。','播放控制集中在底部，按步推进。切回岩馆保持选线状态，漫画角色不进入动作推演。'],journal:['每一趟，都是一页。','记录用连续的分隔线排布，让视频缩略图与难度成为视觉锚点。拍摄为主行动，导入为图标次入口。'],empty:['不用成绩，填补空白。','Buddy 替空页面接住用户。只有一个主行动和导入入口，没有演示成绩、打卡计数或社交压力。'],capture:['完整取景，稳定的快门。','提示与操作全部放在画面外。录制键始终位于右下角；录制前后不漂移，颜色同时有可访问名称。'],recording:['录制时，减少干扰。','保留计时与停止按钮，取消多余动效。控制与提示都不遮挡起步点、结束点和人体。'],review:['原片完整，控制退后。','视频采用 contain 保留完整画幅。可切横片检查留黑，点全屏进入专注模式。逐帧、慢放、分析与剪辑均有可访问图标。'],analysis:['一个时刻，一件事。','观察结果按时刻呈现，点时间回到原片。示例只演示页面结构，不捏造分数或教练诊断。'],edit:['先看片，再调效果。','完整显示成片的输出画幅。效果设置放在抽屉，关闭后回到沉浸预览；分享需主动触发。'],membership:['权益讲清楚，购买不催促。','一次性会员与免费功能明确分开。价格来自 App Store；Android 不出现购买入口。'],states:['遇到问题，也知道下一步。','空状态、权限、数据缺失与操作失败使用同一语言。每个状态给出可执行动作，破坏性操作二次确认。']};

function top(title,back='back',right=''){return `<div class="topbar">${ib('back','返回',back)}<h2>${title}</h2>${right||'<span style="width:44px"></span>'}</div>`;}

eyebrow muted">NOVEMBER 2026</span><span class="small muted">${data.length} 趟</span></div><div id="bb-records">${data.length?data.map((r)=>record(r,recordData.indexOf(r))).join(''):`<div class="empty">${buddy('rest')}<h2>没有匹配的记录</h2>${btn('清除筛选','clear-filter','secondary full')}</div>`}</div>`}</div></div>${nav('journal')}`;}

function render(){clearInterval(playTimer);state.playing=false;root.dataset.platform=state.platform;const p=state.page;const functions={welcome, gym:()=>gym(),simulation:()=>gym(true),routes,body,'no-pack':noPack,journal:()=>journal(),empty:()=>journal(true),filters,folders,import:importPage,'import-ready':()=>form(),organize:()=>form(true),capture:()=>capture(),recording:()=>capture(true),venues,saved,review:()=>media(),analysing:()=>progress(),analysis,editing:()=>progress(true),edit:()=>media(true),settings,language,membership,privacy,licenses,states};app.innerHTML=(functions[p]||functions.journal)();if(p==='organize'){const current=recordData[state.currentRecord];const grade=app.querySelector('#grade-select');if(current&&grade){if(![...grade.options].some(o=>o.value===current.grade))grade.add(new Option(current.grade,current.grade));grade.value=current.grade;}const folder=app.querySelector('#folder-select');if(current&&folder)folder.value=current.folder||'未归档';}root.querySelector('.navigation').innerHTML=pages.map(([g,ps])=>`<div class="group">${g}</div>${ps.map(([id,t])=>`<button class="page-link ${p===id?'active':''}" data-go="${id}" ${p===id?'aria-current="page"':''}><span>${String(Object.keys(titles).indexOf(id)+1).padStart(2,'0')}</span>${t}</button>`).join('')}`).join('');const n=notes[p]||[titles[p],['import','import-ready','organize','filters','folders','venues','language'].includes(p)?'表单与选择沿用统一的间距和原生语义。主要动作固定在底部，输入区域可滚动；图标减少重复文字，必要标签保持清楚。':'锁扣伙伴只在等待与反馈时出现。保留明确的状态与恢复动作，减少装饰和重复说明。'];root.querySelector('#bb-note-title').textContent=n[0];root.querySelector('#bb-note-copy').textContent=n[1];root.querySelector('#bb-note-mascot').innerHTML=buddy(p==='saved'?'success':'wave');root.querySelectorAll('[data-platform]').forEach(b=>b.classList.toggle('active',b.dataset.platform===state.platform));root.querySelector('.island').style.display=state.platform==='ios'?'block':'none';root.querySelector('.phone').style.borderRadius=state.platform==='ios'?'38px':'24px';const dark=['review','edit','capture','recording'].includes(p);root.querySelector('.phone').style.background=dark?'#141917':'var(--bb-paper)';root.querySelector('.phone').style.color=dark?'#f8f8f4':'var(--bb-ink)';if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});if(p==='review'||p==='edit'){app.querySelector('.climber')?.setAttribute('transform',`translate(${Math.sin(state.time)*6} ${-Math.sin(state.time)*5})`);}if(p==='analysing'||p==='editing'){let v=28;timer=setInterval(()=>{if(!root.querySelector('#bb-progress'))return clearInterval(timer);v=Math.min(100,v+8);root.querySelector('#bb-progress').style.width=v+'%';root.querySelector('#bb-percent').textContent=v+'%';if(v===100){clearInterval(timer);go(p==='editing'?'edit':'analysis',false);}},320);}if(p==='recording'){let seconds=0;timer=setInterval(()=>{const e=root.querySelector('#record-time');if(e)e.textContent=`${String(Math.floor(++seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;},1000);}}
function go(p,push=true){if(!titles[p])return;if(push&&p!==state.page)history.push(state.page);clearInterval(timer);clearInterval(playTimer);state.playing=false;state.focus=false;state.page=p;render();persist();}
function toast(msg){root.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;app.append(el);setTimeout(()=>el.remove(),2600);}
function sheet(content){app.querySelector('.sheet-backdrop')?.remove();app.insertAdjacentHTML('beforeend',`<div class="sheet-backdrop" data-dismiss="true"><section class="sheet" role="dialog" aria-modal="true" aria-label="操作面板"><div class="handle"></div><div class="row between" style="margin-bottom:4px"><span></span>${ib('close','关闭面板','dismiss')}</div>${content}</section></div>`);if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});app.querySelector('.sheet button, .sheet input')?.focus();}
function dismiss(){app.querySelector('.sheet-backdrop')?.remove();}
function openSheet(key){if(key==='more')sheet(`<h3>这一趟</h3>${row('edit','整理这一趟','','go:organize')}${row('aspect','画幅预览',state.landscape?'横屏示例':'竖屏示例','aspect')}${row('share','分享复盘文字','','share-text')}${row('trash','删除记录','','error:delete')}`);else if(key==='effects')sheet(`<h3>剪辑效果</h3><div class="gap"></div>${[['slow','慢镜头'],['camera','推拉镜头'],['removal','消除路人']].map(([k,n])=>`<label class="toggle">${n}<input type="checkbox" data-toggle="${k}" ${state[k]?'checked':''}></label>`).join('')}<div class="gap"></div>${btn('应用效果','go:editing','primary full')}<div class="gap-sm"></div><p class="small muted">自动剪辑，可能剪错。此处为效果开关的交互演示。</p>`);else if(key==='folder')sheet(`<h3>新建文件夹</h3><div class="gap"></div>${field('文件夹名称','<input id="folder-name" maxlength="30" placeholder="例如：想再试的">')}${btn('创建','create-folder','primary full')}`);else if(key==='gym')sheet(`<h3>选择岩馆</h3>${row('gym','示例岩馆','当前','go:gym')}${row('gym','另一家示例岩馆',state.platform==='ios'?'会员':'内置','go:'+(state.platform==='ios'?'membership':'gym'))}`);else if(key==='capture-help')sheet(`<h3>把整个人留在画面里。</h3><ul class="check-list"><li>${ic('person')}全身入镜，起步与结束点都可见。</li><li>${ic('camera')}手机固定，拍摄过程保持机位。</li><li>${ic('volume')}只录画面，不录音。</li></ul>${btn('知道了','dismiss','primary full')}`);else if(key==='stop')sheet(`<h3>结束这次拍摄？</h3><div class="gap"></div>${btn('停止并保存','stop-record','primary full')}<div class="gap-sm"></div>${btn('继续拍摄','dismiss','secondary full')}`);else if(key==='capture-grade')sheet(`<h3>线路难度</h3><div class="gap"></div><div class="chips">${['未标级','V0','V1','V2','V3','V4','V5','V6'].map(x=>`<button class="chip" data-action="capture-grade:${x}">${x}</button>`).join('')}</div>`);else if(key==='analysis-settings')sheet(`<h3>分析参数</h3><div class="gap"></div>${field('身高（cm）',`<input type="number" min="140" max="200" value="${state.height}" data-input="height">`)}${field('体重（kg）',`<input type="number" min="35" max="110" value="${state.weight}" data-input="weight">`)}${field('墙面角度（°）','<input type="number" min="0" max="80" value="15">')}${btn('应用参数','go:analysing','primary full')}`);else if(key==='reanalyze')sheet(`<h3>重新分析这一趟？</h3><div class="gap-sm"></div><p class="small muted">将替换已有分析与剪辑计划，原片不变。</p><div class="gap"></div>${btn('重新分析','go:analysing','primary full')}`);else if(key==='purchase')sheet(`<h3>由 App Store 完成购买</h3><div class="gap"></div><p class="small muted">价格在正式应用中从 App Store 读取。此设计稿不会发起购买。</p><div class="gap"></div>${btn('预览购买成功状态','purchase-demo','primary full')}`);else if(key==='share')sheet(`<h3>分享视频</h3><div class="gap-sm"></div><p class="small muted">正式应用打开系统分享面板，由你选择接收方。</p><div class="gap"></div><div class="notice">这是交互预览，不会生成或发送文件。</div><div class="gap"></div>${btn('完成预览','dismiss','primary full')}`);else if(key==='support')sheet(`<h3>帮助与支持</h3><div class="gap"></div><p class="small muted">遇到问题时，可查看应用说明或联系支持。此设计稿不打开外部服务。</p><div class="gap"></div>${btn('查看状态与恢复设计','go:states','primary full')}`);}
function error(key){const data={permission:['需要相机权限','允许后就能在应用里拍摄。也可以直接导入已有视频。','打开系统设置','system-settings'],save:['这一趟还没存好','原片暂时保留。请重试保存，或确认后放弃这段录像。','再存一次','go:saved'],'analysis-error':['这次没能分析出来','原片已保存，可以继续回看或重新分析。','重新分析','go:analysing'],'edit-error':['这次没能剪出来','原片不受影响，可以重新生成成片。','再试一次','go:editing'],load:['岩馆暂时没打开','重新加载后再试一次。','重新加载','go:gym'],incomplete:['岩馆数据不完整','请重新安装包含完整数据包的版本。攀爬册仍然可以使用。','去攀爬册','go:journal'],hot:['让手机休息一下','设备温度较高，分析已停止。等降温后再试，原片已保存。','回看原片','go:review'],delete:['删除这一趟？','原片、分析和记录都会从本机移除，无法恢复。','删除记录','confirm-delete']};const d=data[key];sheet(`<h3>${d[0]}</h3><div class="gap"></div><p class="small muted">${d[1]}</p><div class="gap"></div>${btn(d[2],d[3],'primary full')}<div class="gap-sm"></div>${btn(key==='permission'?'改从相册导入':'取消',key==='permission'?'go:import':'dismiss','secondary full')}${key==='save'?'<button class="inline-link" data-action="discard">放弃这段录像</button>':''}`);}
function action(a,el){const [key,value]=a.split(':');if(key==='go')return go(value);if(a==='back')return go(history.pop()||'journal',false);if(a==='dismiss')return dismiss();if(key==='sheet')return openSheet(value);if(key==='error')return error(value);if(a==='focus'){state.focus=!state.focus;return render();}if(key==='media-tap'){if(state.focus){state.focus=false;render();}return;}if(a==='aspect'){state.landscape=!state.landscape;render();return;}if(a==='play'){state.playing=!state.playing;const playing=state.playing;el.innerHTML=ic(playing?'pause':'play');el.setAttribute('aria-label',playing?'暂停':'播放');if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}});clearInterval(playTimer);if(playing)playTimer=setInterval(()=>{state.time=(state.time+1)%43;const range=app.querySelector('[data-input=time]');if(range)range.value=state.time;const label=app.querySelector('#time-label');if(label)label.textContent=`00:${String(Math.floor(state.time)).padStart(2,'0')} / 00:42`;app.querySelector('.climber')?.setAttribute('transform',`translate(${Math.sin(state.time)*6} ${-Math.sin(state.time)*5})`);},1000/state.speed);return;}if(a==='simulate'){state.playing=!state.playing;el.innerHTML=ic(state.playing?'pause':'play');clearInterval(playTimer);if(state.playing)playTimer=setInterval(()=>{state.step=state.step%12+1;app.querySelector('#bb-step').textContent=state.step+'/12';app.querySelector('[data-input=step]').value=state.step;app.querySelector('.climber')?.setAttribute('transform',`translate(${Math.sin(state.step)*12} ${-state.step*5})`);},650);return;}if(key==='step'||key==='analysis-step'){state.step=Math.max(1,Math.min(12,state.step+Number(value)));render();return;}if(key==='frame'){state.time=Math.max(0,Math.min(42,state.time+Number(value)/30));render();return;}if(a==='speed'){state.speed=state.speed===1?.5:1;render();return;}if(a==='toggle-sent'){state.sent=!state.sent;if(recordData[state.currentRecord])recordData[state.currentRecord].sent=state.sent;render();return;}if(a==='clear-filter'||a==='reset-filter'){state.filter='全部';state.grade='全部';state.period='不限';state.search='';state.folder='全部';if(a==='clear-filter')go('journal');else render();return;}if(a==='pick-demo'){go('import-ready');return;}if(a==='save-import'||a==='save-organize'){const title=app.querySelector('#climb-title')?.value.trim();state.title=title||'新的一趟';if(a==='save-import'){recordData.unshift({title:state.title,grade:app.querySelector('#grade-select').value,date:'今天 · 18:42',sent:state.sent,folder:app.querySelector('#folder-select').value});go('journal');toast('已保存示例记录');}else{recordData[state.currentRecord].title=state.title;recordData[state.currentRecord].grade=app.querySelector('#grade-select').value;recordData[state.currentRecord].folder=app.querySelector('#folder-select').value;go('review');toast('修改已保留在本次原型中');}return;}if(key==='record'){state.currentRecord=Number(value);const r=recordData[state.currentRecord];state.title=r.title;state.sent=r.sent;go('review');return;}if(a==='start-record'){go('recording');return;}if(a==='stop-record'){go('saved');return;}if(key==='seek'){state.time=Number(value);go('review');return;}if(a==='create-folder'){const n=app.querySelector('#folder-name').value.trim();if(!n)return toast('请填写文件夹名称');if(state.folders.includes(n))return toast('已存在同名文件夹');state.folders.push(n);render();toast('文件夹已创建');return;}if(key==='folder-menu'){sheet(`<h3>${escape(state.folders[Number(value)])}</h3><div class="gap"></div>${field('重命名',`<input id="rename-folder" value="${escape(state.folders[Number(value)])}" maxlength="30">`)}${btn('保存名称','rename-folder:'+value,'primary full')}<div class="gap"></div>${btn('删除文件夹','delete-folder:'+value,'secondary full','trash')}`);return;}if(key==='rename-folder'){const n=app.querySelector('#rename-folder').value.trim();if(!n)return toast('请填写名称');if(state.folders.includes(n)&&n!==state.folders[Number(value)])return toast('已存在同名文件夹');const old=state.folders[Number(value)];state.folders[Number(value)]=n;recordData.forEach(r=>{if(r.folder===old)r.folder=n;});render();return;}if(key==='delete-folder'){const old=state.folders[Number(value)];state.folders.splice(Number(value),1);recordData.forEach(r=>{if(r.folder===old)r.folder='未归档';});state.folder='全部';render();toast('文件夹已删除，记录保留');return;}if(a==='confirm-delete'){recordData.splice(state.currentRecord,1);go(recordData.length?'journal':'empty');toast('示例记录已删除');return;}if(a==='discard'){sheet(`<h3>放弃这段录像？</h3><div class="gap"></div><p class="small muted">未保存的视频将被移除，无法恢复。</p><div class="gap"></div>${btn('确认放弃','go:journal','primary full')}${btn('继续保存','go:saved','secondary full')}`);return;}if(key==='character'){if(value==='cat'&&state.platform==='ios')return go('membership');state.cat=value==='cat';render();if(state.cat)toast('猫角色已选择 · 模型为结构示意');return;}if(key==='view'){app.querySelectorAll('.stage-tools .icon-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');const art=app.querySelector('.wall-art');if(art)art.style.transform=value==='side'?'perspective(700px) rotateY(-18deg)':'none';return;}if(key==='wall'){el.parentElement.querySelectorAll('.chip').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');app.querySelectorAll('[data-route]').forEach(r=>r.hidden=value!=='0'&&r.dataset.wall!==(value==='1'?'A':'B'));return;}if(key==='focus')return app.querySelector('#'+value)?.focus();if(key==='discipline'){el.parentElement.querySelectorAll('.chip').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');const gs=app.querySelector('#grade-select');gs.innerHTML=(value==='抱石'?['未标级','V2','V3','V4','V5']:['未标级','5.9','5.10a','5.10b','5.11a']).map(v=>`<option>${v}</option>`).join('');return;}if(key==='capture-grade'){state.captureGrade=value;dismiss();app.querySelector('[data-action="sheet:capture-grade"]').innerHTML=value;return;}if(key==='mark'){toast(value==='start'?'起步标记模式：点击示例画面':'结束标记模式：点击示例画面');app.querySelector('.media-frame').onclick=e=>{if(e.target.closest('button'))return;toast(value==='start'?'示例起步点已标记':'示例结束点已标记');};return;}if(a==='nearby'){app.querySelector('#venue-section').textContent='附近 · 位置排序示意';toast('原型仅演示位置排序，不获取真实位置');return;}if(key==='choose-venue'){state.venue=['示例岩馆','示例攀岩空间','示例抱石馆'][Number(value)];go('capture');toast('已选择'+state.venue);return;}if(a==='purchase-demo'){dismiss();toast('会员解锁成功 · 仅状态预览');return;}if(a==='restore'){toast('恢复购买状态预览：当前没有可恢复的示例购买');return;}if(a==='system-settings'){dismiss();toast('正式应用在此打开系统权限设置');return;}if(a==='share-text'){dismiss();openSheet('share');return;}if(key==='license'){sheet(`<h3>${value==='osm'?'OpenStreetMap':value==='androidx'?'AndroidX / Media3':'MediaPipe'}</h3><div class="gap"></div><p class="small muted">${value==='osm'?'ODbL 数据署名与来源说明':'Apache License 2.0'}。正式应用在此显示随安装包提供的许可全文。</p>`);return;}if(key==='benefit'){toast({gyms:'解锁数据包中的更多岩馆',cats:'两种猫、两种岩点模式',badge:'会员标识显示在攀爬册顶部'}[value]);return;}}
root.addEventListener('click',e=>{const el=e.target.closest('button,[data-action]');if(e.target.classList.contains('sheet-backdrop'))return dismiss();if(!el||!root.contains(el))return;if(el.dataset.platform){state.platform=el.dataset.platform;render();persist();return;}if(el.dataset.go)return go(el.dataset.go);if(el.dataset.action)return action(el.dataset.action,el);if(el.dataset.folder){state.folder=el.dataset.folder;go('journal');return;}if(el.dataset.filter){state.filter=el.dataset.filter;render();return;}if(el.dataset.grade){state.grade=el.dataset.grade;render();return;}if(el.dataset.period){state.period=el.dataset.period;render();return;}if(el.dataset.route){state.route=el.dataset.route;state.routeGrade=el.querySelector('.route-dot').textContent;go('gym');return;}if(el.dataset.color){state.selectedColor=el.dataset.color;render();return;}if(el.dataset.language){state.language=el.dataset.language;render();return;}});
root.addEventListener('input',e=>{const el=e.target;if(el.id==='bb-search'){state.search=el.value;const start=el.selectionStart;render();const input=app.querySelector('#bb-search');input.focus();input.setSelectionRange(start,start);return;}if(el.id==='route-search'){const q=el.value.trim();app.querySelectorAll('[data-route]').forEach(r=>r.hidden=!r.textContent.includes(q));return;}if(el.id==='venue-search'){const q=el.value.trim();app.querySelectorAll('#venue-results .line-row').forEach(r=>r.hidden=!r.textContent.includes(q));return;}if(el.dataset.input){const k=el.dataset.input;state[k]=Number(el.value);const out=app.querySelector('#'+k+'-value');if(out)out.textContent=el.value+(k==='height'?' cm':' kg');if(k==='time')app.querySelector('#time-label').textContent=`00:${String(Math.floor(state.time)).padStart(2,'0')} / 00:42`;if(k==='step'){app.querySelector('#bb-step').textContent=state.step+'/12';app.querySelector('.climber')?.setAttribute('transform',`translate(0 ${-state.step*4})`);}return;}});
root.addEventListener('change',e=>{if(e.target.dataset.toggle)state[e.target.dataset.toggle]=e.target.checked;});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){if(app.querySelector('.sheet-backdrop'))dismiss();else if(state.focus){state.focus=false;render();}}if(e.key==='Tab'){const modal=app.querySelector('.sheet');if(!modal)return;const items=[...modal.querySelectorAll('button,input,select')].filter(x=>!x.disabled);if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}});
render();
if(globalThis.Tweak){const visual={accent:'#fa724b',radius:18};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--bb-orange',visual.accent);root.style.setProperty('--bb-radius',visual.radius+'px');}});tweak.addColorPicker(visual,'accent',{label:'行动强调色',reference:'--bb-orange'});tweak.addSlider(visual,'radius',{label:'漫画面板圆角',min:8,max:24,unit:'px'});}
})();
</script>
</div>
</main></body></html>
