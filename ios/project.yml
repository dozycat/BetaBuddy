name: BetaBuddy
options:
  bundleIdPrefix: com.betabuddy
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 'PR5A8VMY8S'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  BetaBuddy:
    type: application
    platform: iOS
    sources:
      - BetaBuddy
      - LocalMediaPipe/LocalTasksLogger.cc
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: com.betabuddy.ios
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BetaBuddy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 选择攀爬视频，在这台 iPhone 上分析动作。
        CLANG_CXX_LANGUAGE_STANDARD: 'c++17'
        HEADER_SEARCH_PATHS: '$(inherited) $(PROJECT_DIR)/LocalMediaPipe/Headers'
        OTHER_LDFLAGS: '$(inherited) -ObjC'
        OTHER_LDFLAGS[sdk=iphoneos*]: '$(inherited) -force_load $(PROJECT_DIR)/Vendor/LocalGraph/device.a'
        OTHER_LDFLAGS[sdk=iphonesimulator*]: '$(inherited) -force_load $(PROJECT_DIR)/Vendor/LocalGraph/simulator.a'
    dependencies:
      - framework: Vendor/MediaPipeTasksVision/frameworks/MediaPipeTasksVision.xcframework
        embed: false
      - framework: Vendor/MediaPipeTasksCommon/frameworks/MediaPipeTasksCommon.xcframework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
  BetaBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BetaBuddyTests]
    dependencies:
      - target: BetaBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  BetaBuddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BetaBuddyUITests]
    dependencies:
      - target: BetaBuddy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BetaBuddy:
    build:
      targets:
        BetaBuddy: all
    test:
      targets: [BetaBuddyTests, BetaBuddyUITests]
